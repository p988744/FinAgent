name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run tests (unit and integration only, skip LLM-dependent tests)
      run: uv run pytest tests/ -m "not slow" --ignore=tests/test_boundary_cases.py --ignore=tests/test_metadata_generation.py --cov=src/finagent --cov-report=xml
      env:
        # Set dummy API keys for tests that check config loading
        LLM_API_KEY: test-key
        EMBEDDING_API_KEY: test-key

    - name: Lint with ruff
      run: uv run ruff check src/

    - name: Format check with black
      run: uv run black --check src/

